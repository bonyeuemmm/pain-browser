name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --project-name pain_browser .
          git checkout -- lib/main.dart pubspec.yaml || true

      - name: Set app name + permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Pain Browser"/' $MANIFEST
          if ! grep -q "android.permission.INTERNET" $MANIFEST; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi
          sed -i 's/android:name="android.app.Application"/android:name="android.app.Application" android:usesCleartextTraffic="true"/' $MANIFEST || true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pain-browser-apk
          path: build/app/outputs/flutter-apk/app-release.apk
